name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste captured text, real names, window titles, URLs, logs that name your loops, or API keys.** Replace them with fictional ones.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (redacted)
      description: "`cd daemon && bun src/cli.ts logs -n 100`"
      render: text
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.4, Apple M2
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Nova commit
      description: "`git rev-parse --short HEAD`"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Gemini (GEMINI_API_KEY)
        - OpenAI-compatible (hosted)
        - OpenAI-compatible (local server)
